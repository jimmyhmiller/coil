# The native backend's IR and assembler: CIR (cir.coil, cir_copies.coil), the IR
# the Coil compiler lowers to for the native backend, and the assembler its code
# goes into (asm.coil, buf.coil), from which src/compiler/object/ writes Mach-O
# and ELF. They come from coil-tpde (see NOTICE). Its modules are native.*, so
# it is a package of its own, which the compiler and its declarative backend
# depend on (../../../Coil.toml, ../declarative/Coil.toml).
[package]
name = "native"
source-roots = ["."]
