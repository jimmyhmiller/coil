[package]
name = "compiler"
entry = "main.coil"
source-roots = ["."]
exclude = ["./prelude.coil", "./meta/metashim.coil", "./meta/metashim_wasm.coil", 
           # the tpde and stogir packages, dependencies of their own
           # (tpde/Coil.toml, stogir/Coil.toml)
           "./tpde", "./stogir"]

[native-dependencies]
llvm = { flags-command = "llvm-config --ldflags --libs --system-libs" }
