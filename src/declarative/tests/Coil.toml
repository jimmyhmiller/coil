# The backend's own tests (scripts/tests/declarative.py runs them), and toy/, a
# calculator and two storage clients written in the same languages: a second
# client of the languages, sharing nothing with the backend but them.
[package]
name = "declarative-tests"
source-roots = ["."]

[dependencies]
declarative = { path = ".." }

[modules]
"toy.storage" = "toy/storage.pass"
"toy.chunks" = "toy/chunks.pass"
"toy.calc" = "toy/calc.ir"
"toy.unit" = "toy/calc.unit"
"toy.tidy" = "toy/tidy.rewrite"
"toy.known" = "toy/known.flow"
"toy.sharpen" = "toy/sharpen.rewrite"
"toy.measure" = "toy/measure.pass"
"toy.steps" = "toy/steps.pipeline"
