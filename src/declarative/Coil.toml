# The native backend's sources: the languages it is written in (lang/), the
# files written in them, and their tests. Coil compiles what these languages
# make of them, written out to src/compiler/declarative/generated by
# scripts/compiler/gen-declarative.py, beside the hand-written runtime and
# adapter in src/compiler/declarative/rt and adapter. See NOTICE there.
[package]
name = "declarative-sources"
entry = "generate.coil"
# The source project compiles every native module from its .pass source.
# Compiler builds and installed clients use native/generated instead.
source-roots = [".", "../compiler/declarative/rt", "../compiler/declarative/adapter", "../compiler/native"]
exclude = ["../compiler/native/generated/*"]

[readers]
".ir" = "lang.readers"
".unit" = "lang.readers"
".pass" = "lang.readers"
".isa" = "lang.readers"
".lower" = "lang.readers"
".abi" = "lang.readers"
".rewrite" = "lang.readers"
".layout" = "lang.readers"
".pipeline" = "lang.readers"
".flow" = "lang.readers"
".ops" = "lang.readers"
".select" = "lang.readers"
".instance" = "lang.readers"
".numbers" = "lang.readers"

