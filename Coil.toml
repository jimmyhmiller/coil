[workspace]
name = "coil"
members = ["src/compiler"]

[dependencies]
# the native backend's IR and assembler, from coil-tpde (src/compiler/native/NOTICE)
native = { path = "src/compiler/native" }

# the declarative backend (`--backend native`),
# written out from coil-stogir-declarative (src/compiler/declarative/NOTICE)
declarative = { path = "src/compiler/declarative" }
