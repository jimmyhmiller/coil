[workspace]
name = "coil"
members = ["src/compiler"]

[dependencies]
# the tpde backend, vendored from coil-tpde (src/compiler/tpde/NOTICE)
tpde = { path = "src/compiler/tpde" }

# the declarative backend (`--backend stogir` or `--backend declarative`),
# written out from coil-stogir-declarative (src/compiler/declarative/NOTICE)
declarative = { path = "src/compiler/declarative" }
