[workspace]
name = "coil"
members = ["src/compiler"]

[dependencies]
# generated native IR and assembler; sources: src/declarative/native (see NOTICE)
native = { path = "src/compiler/native" }

# the native backend (`--backend native`): its runtime, its adapter from CIR,
# and the Coil its languages make of src/declarative (src/compiler/declarative/NOTICE)
declarative = { path = "src/compiler/declarative" }
