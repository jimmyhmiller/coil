# The main project: a package using every dependency kind and Coil.toml section
# a user reaches for. Run by scripts/tests/fast/projects.sh from a scratch copy,
# which fills in the @…@ placeholders.
[package]
name = "pfapp"
entry = "src/main.coil"
source-roots = ["src", "tests"]

[dependencies]
pathlib = { path = "../deps/pathlib" }
gitlib = { git = "@GITLIB_URL@", sha = "@GITLIB_SHA@" }
engine = { path = "../deps/engine", prebuilt = true }
tools = { path = "../deps/tools" }

[cc]
sources = ["native/answer.c"]
include-dirs = ["native"]
flags = ["-std=c11", "-Wall", "-Werror"]

[link]
libs = ["m"]
flags = ["@LINK_FLAG@"]

[profile.safe]
inherits = "release"
use = ["coil.safety"]

[artifacts.tool]
kind = "executable"
entry = "src/tool.coil"
out = "build/tools/tool"

[artifacts.runtime]
kind = "object"
entry = "src/runtime.coil"
out = "build/runtime.o"

[metaprograms]
use = ["pftools.inc"]

[lint]
rules = ["pftools.lint"]

[readers]
".kv" = "pftools.kv"

[modules]
"pfapp.settings" = "data/settings.kv"

[test.suites.unit]
roots = ["tests"]
suffixes = ["_test.coil"]

[test.suites.slow]
roots = ["tests/slow"]
suffixes = ["_slow.coil"]
default = false
