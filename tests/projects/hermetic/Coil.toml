# A standalone package beside the workspace: [language] belongs to the root
# manifest of a compilation, so a workspace member cannot choose its own.
# The environment-free standard library, plus an ambient name supplied by a
# root-activated core provider.
[package]
name = "hermetic"
entry = "src/main.coil"

[language]
stdlib = "hermetic"
core-providers = ["pfplatform.core"]

[dependencies]
platform = { path = "../deps/platform" }
