[package]
name = "provider-order"
entry = "src/main.coil"

# Ambient core is ordered: `alternate.core` is listed last, so its
# `platform-answer` (7) overrides `platform.core`'s (42).
[language]
core-providers = ["platform.core", "alternate.core"]

[dependencies]
platform = { path = "../provider" }
alternate = { path = "../provider2" }
