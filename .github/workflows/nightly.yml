name: Private nightly release

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coil-private-nightly
  cancel-in-progress: false

env:
  RELEASE_SEQUENCE: ${{ github.run_number }}
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_PUBLISHED_AT: ${{ github.event.repository.updated_at }}

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies
        run: brew install coreutils llvm
      - name: Build bundled libcurl
        run: scripts/native/build-curl.sh
      - name: Build verified static toolchain
        env:
          COIL_LLVM_LINK: static
          COIL_SKIP_INSTALL: "1"
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
        run: python3 scripts/dev.py build full
      - name: Package toolchain
        run: |
          python3 scripts/release/package-toolchain.py \
            --compiler build/bin/coil --output dist \
            --commit "$RELEASE_COMMIT" --sequence "$RELEASE_SEQUENCE" \
            --published-at "$RELEASE_PUBLISHED_AT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coil-nightly-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install LLVM and static system libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends llvm-21 llvm-21-dev clang-21 libclang-rt-21-dev libzstd-dev libxml2-dev
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - name: Build bundled libcurl
        run: scripts/native/build-curl.sh
      - name: Build verified static toolchain
        env:
          COIL_LLVM_LINK: static
          COIL_SKIP_INSTALL: "1"
          LLVM_CONFIG: llvm-config-21
        run: python3 scripts/dev.py build linux
      - name: Package toolchain
        run: |
          python3 scripts/release/package-toolchain.py \
            --compiler build/bin/coil --output dist \
            --commit "$RELEASE_COMMIT" --sequence "$RELEASE_SEQUENCE" \
            --published-at "$RELEASE_PUBLISHED_AT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coil-nightly-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: nightly-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coil-nightly-*
          path: dist
          merge-multiple: true
      - name: Publish transaction
        env:
          RELEASE_BASE_URL: ${{ vars.COIL_RELEASE_BASE_URL }}
          RELEASE_AUDIENCE: ${{ vars.COIL_RELEASE_AUDIENCE }}
        run: python3 scripts/release/publish-nightly.py --base-url "$RELEASE_BASE_URL" --audience "$RELEASE_AUDIENCE" --input dist
