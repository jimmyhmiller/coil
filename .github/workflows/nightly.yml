name: Private nightly release
# nightly-autofix redispatches this workflow after pushing a fix and counts its
# attempts by reading "[autofix N]" back out of the run name.
run-name: ${{ inputs.autofix_attempt && format('Private nightly release [autofix {0}]', inputs.autofix_attempt) || 'Private nightly release' }}

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      autofix_attempt:
        description: Set by nightly-autofix when it reruns the nightly; leave empty for a manual run
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: coil-private-nightly
  cancel-in-progress: false

env:
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  # Settle what this nightly is, and whether it has anything to publish, before
  # two runners spend ninety minutes each finding out the expensive way.
  #
  # A published build is immutable and the toolchain does not compile
  # byte-identically twice, so a run whose commit the channel already publishes
  # cannot publish anything: completion refuses it as the same commit with
  # different artifacts. That is *every* nightly between pushes, which is why the
  # nightly was red on any day main did not move. Gatekeeper owns that rule and
  # is asked (`publications/preflight`) rather than second-guessed here.
  #
  # The release identity comes from the commit rather than from the run, so it is
  # the same on a re-run. The build jobs take it from this job's outputs, which
  # is also what makes the two of them agree — publication requires it.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: nightly-release
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sequence: ${{ steps.plan.outputs.sequence }}
      published_at: ${{ steps.plan.outputs.published_at }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Plan the release
        id: plan
        env:
          RELEASE_BASE_URL: ${{ vars.COIL_RELEASE_BASE_URL }}
          RELEASE_AUDIENCE: ${{ vars.COIL_RELEASE_AUDIENCE }}
        run: |
          # pipefail, or `tee` reports success for a plan that refused to plan.
          set -euo pipefail
          python3 scripts/release/plan-nightly.py \
            --base-url "$RELEASE_BASE_URL" --audience "$RELEASE_AUDIENCE" \
            --commit "$RELEASE_COMMIT" | tee -a "$GITHUB_OUTPUT"
      # Gatekeeper's wording reaches the shell as data, never as script text.
      - name: Report the plan
        env:
          PLAN_BUILD: ${{ steps.plan.outputs.build }}
          PLAN_SEQUENCE: ${{ steps.plan.outputs.sequence }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if [ "$PLAN_BUILD" = "true" ]; then
            echo "Building \`$RELEASE_COMMIT\` as sequence \`$PLAN_SEQUENCE\`." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to publish: $PLAN_REASON" >> "$GITHUB_STEP_SUMMARY"
          fi

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RELEASE_SEQUENCE: ${{ needs.plan.outputs.sequence }}
      RELEASE_PUBLISHED_AT: ${{ needs.plan.outputs.published_at }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/nightly-build-deps
      - name: Build verified static toolchain
        env:
          COIL_LLVM_LINK: static
          COIL_SKIP_INSTALL: "1"
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
        run: python3 scripts/dev.py build full
      - name: Package toolchain
        run: |
          python3 scripts/release/package-toolchain.py \
            --compiler build/bin/coil --output dist \
            --commit "$RELEASE_COMMIT" --sequence "$RELEASE_SEQUENCE" \
            --published-at "$RELEASE_PUBLISHED_AT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coil-nightly-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_SEQUENCE: ${{ needs.plan.outputs.sequence }}
      RELEASE_PUBLISHED_AT: ${{ needs.plan.outputs.published_at }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/nightly-build-deps
      - name: Build verified static toolchain
        env:
          COIL_LLVM_LINK: static
          COIL_SKIP_INSTALL: "1"
          LLVM_CONFIG: llvm-config-21
        run: python3 scripts/dev.py build linux
      - name: Package toolchain
        run: |
          python3 scripts/release/package-toolchain.py \
            --compiler build/bin/coil --output dist \
            --commit "$RELEASE_COMMIT" --sequence "$RELEASE_SEQUENCE" \
            --published-at "$RELEASE_PUBLISHED_AT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coil-nightly-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: nightly-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coil-nightly-*
          path: dist
          merge-multiple: true
      - name: Publish transaction
        env:
          RELEASE_BASE_URL: ${{ vars.COIL_RELEASE_BASE_URL }}
          RELEASE_AUDIENCE: ${{ vars.COIL_RELEASE_AUDIENCE }}
        run: python3 scripts/release/publish-nightly.py --base-url "$RELEASE_BASE_URL" --audience "$RELEASE_AUDIENCE" --input dist

  # Hand a failure on main to Claude Code (see nightly-autofix.yml). The job's
  # permissions are the ceiling for the called workflow, whose own jobs narrow
  # them: only its final, non-agent job gets these write scopes.
  autofix:
    needs: [plan, macos, linux, publish]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
      issues: write
    uses: ./.github/workflows/nightly-autofix.yml
    with:
      run_id: ${{ github.run_id }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
