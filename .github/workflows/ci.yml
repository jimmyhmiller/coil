name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm-free:
    name: LLVM-free self-host
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rebuild and verify the LLVM-free compiler
        run: python3 scripts/dev.py build nollvm

  full:
    name: Full self-host and gates
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LLVM
        run: brew install llvm

      - name: Rebuild and run the complete verification gates
        run: python3 scripts/dev.py build full
