name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm-free:
    name: LLVM-free self-host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COIL_STDLIB_DIR: /tmp/coil-source

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Expose current sources to the bootstrap seed
        run: |
          mkdir -p "$COIL_STDLIB_DIR/src"
          ln -s "$GITHUB_WORKSPACE/src/stdlib" "$COIL_STDLIB_DIR/lib"
          ln -s "$GITHUB_WORKSPACE/src/compiler" "$COIL_STDLIB_DIR/src/compiler"

      - name: Rebuild and verify the LLVM-free compiler
        run: python3 scripts/dev.py build nollvm-linux

  linux:
    name: Linux self-host and gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COIL_STDLIB_DIR: /tmp/coil-source

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Expose current sources to the bootstrap seed
        run: |
          mkdir -p "$COIL_STDLIB_DIR/src"
          ln -s "$GITHUB_WORKSPACE/src/stdlib" "$COIL_STDLIB_DIR/lib"
          ln -s "$GITHUB_WORKSPACE/src/compiler" "$COIL_STDLIB_DIR/src/compiler"

      - name: Install LLVM 21
        run: |
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-21 llvm-21 llvm-21-dev

      - name: Rebuild and run the Linux verification gates
        run: python3 scripts/dev.py build linux
