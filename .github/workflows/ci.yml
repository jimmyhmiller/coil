name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, and it reads the one thing nothing else does. Every other job exercises
  # a seed the host can RUN, so an artifact for a platform CI never builds on can rot
  # invisibly -- which is exactly what happened: the Linux seeds sat pre-migration for
  # months while CI stayed green, because both jobs ran on macOS and nothing on the
  # Mac can execute an ELF binary. This one needs no compiler and no host: it checks
  # that each committed seed names a commit that actually exists in this history.
  seed-provenance:
    name: Seed provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `git cat-file` and `merge-base --is-ancestor` need real history, and the
          # default shallow clone has none of it.
          fetch-depth: 0

      - name: Every committed seed names a resolvable commit
        run: scripts/compiler/oracle/gate-seed-provenance.sh

  llvm-free:
    name: LLVM-free self-host
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build bundled libcurl
        run: scripts/native/build-curl.sh

      - name: Rebuild and verify the LLVM-free compiler
        run: python3 scripts/dev.py build nollvm

  full:
    name: Full self-host, gates, and fast suite
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install CI dependencies
        run: brew install coreutils llvm

      - name: Build bundled libcurl
        run: scripts/native/build-curl.sh

      - name: Rebuild and run the complete verification gates
        run: |
          python3 scripts/dev.py build full || {
            echo "Full verification failed; rerunning the CLI gate with diagnostics"
            scripts/compiler/oracle/gate-cli.sh /tmp/coil-rb2
            exit 1
          }

      # Runs against the compiler the step above just built and proved a fixpoint
      # for, so it costs only the tests -- about 80 seconds. A separate job would
      # have to either build the compiler again or ship it through an artifact and
      # wait for this job to finish first; both are slower than just using what is
      # already here.
      #
      # It also puts back the two checks that run nowhere else since the Linux
      # bootstrap stopped running gates: oracle coverage and the hygiene audit.
      - name: Fast suite
        timeout-minutes: 5
        run: scripts/tests/fast-suite.sh build/bin/coil

      # The metaprogram-entry gates have no coverage anywhere else: neither
      # bootstrap runs them (both prove the fixpoint and nothing else), and at
      # ~40s gate-staged-meta does not fit the fast suite's 80-second budget.
      # gate-staged-meta arrived with a gate script nothing invoked, so on the
      # day it merged it was already unrun. Same already-built compiler, so this
      # costs only the tests.
      - name: Metaprogram entry gates
        timeout-minutes: 5
        run: python3 scripts/dev.py test meta-entries --compiler build/bin/coil

  linux:
    name: Linux x86-64 self-host
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Until this job existed, CI ran only on macOS, so only the Mach-O seeds were
    # ever exercised. Both Linux seeds and the linux-ir escape hatch silently fell
    # behind the namespace migration and a clean checkout could not bootstrap here
    # at all — while CI stayed green. A platform with no CI job has no forcing
    # function to keep its seed current.
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Bounded on its own, because it is the step that actually goes wrong: a
      # runner whose Azure apt mirror stalls used to sit here until the 60-minute
      # JOB timeout killed it, so a mirror hiccup read as "the Linux build is
      # broken" and burned an hour doing it. `add-apt-repository` is avoided for
      # the same reason -- it runs its own update, which is the part that hangs.
      - name: Install LLVM 21
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          # Two runs in a row died here, once for an hour and once for twelve
          # minutes, and neither was our code: GitHub's Ubuntu image points apt at
          # an Azure mirror that intermittently stalls mid-fetch. `Acquire::Retries`
          # does not help, because a stall is not a failure -- without a TIMEOUT apt
          # waits forever and the step is killed by the clock rather than by apt.
          #
          # So: three defences, in order of importance. An explicit http timeout
          # turns a stall into a fast error; a retry loop absorbs that error; and
          # the mirror is swapped for archive.ubuntu.com, which is slower on a good
          # day and up on a bad one.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25"
          for attempt in 1 2 3; do
            # shellcheck disable=SC2086
            sudo apt-get update $APT_OPTS && break
            echo "apt-get update stalled or failed (attempt $attempt of 3); retrying"
            sleep 5
          done
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_OPTS \
            llvm-21 llvm-21-dev clang-21 libclang-rt-21-dev
          # rebootstrap-linux.sh probes llvm-config-21 first, but the compiler
          # resolves its own C driver through whichever llvm-config wins on PATH —
          # so a mismatched default silently links against the wrong clang's
          # runtime and only the sanitizer checks notice.
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - name: Build bundled libcurl
        run: scripts/native/build-curl.sh

      - name: Rebuild and verify the Linux compiler
        timeout-minutes: 15
        run: python3 scripts/dev.py build linux
