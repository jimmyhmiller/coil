name: Nightly autofix

# When the nightly fails on main, hand the failure to Claude Code, push its fix,
# and run the nightly again. Split into three jobs so no single job holds both
# the Claude credential and write access to the repository:
#
#   triage  actions:read    decides whether to act; fetches the failed jobs' logs
#   fix     contents:read   Claude reproduces, fixes, verifies, commits locally;
#                           exports the commits as a patch. No git credentials.
#   apply   contents/actions/issues:write, no Claude credential. Rejects patches
#           that touch .github/, pushes to main, redispatches the nightly with
#           autofix_attempt=N, and reports on a `nightly-autofix` issue.
#
# Only a scheduled or manually dispatched nightly on main can trigger this, so its
# input is this repository's own main branch and CI logs of it. Attempts are capped
# at MAX_ATTEMPTS per failure chain; the count travels in the nightly's run name.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# or ANTHROPIC_API_KEY.

on:
  workflow_run:
    workflows: [Private nightly release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a failed nightly run to fix
        required: true
      force:
        description: Proceed even if a newer nightly run exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: nightly-autofix
  cancel-in-progress: false

env:
  MAX_ATTEMPTS: 2
  CLAUDE_CODE_VERSION: 2.1.278
  CLAUDE_MODEL: claude-opus-5

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.triage.outputs.proceed }}
      notify: ${{ steps.triage.outputs.notify }}
      reason: ${{ steps.triage.outputs.reason }}
      attempt: ${{ steps.triage.outputs.attempt }}
      os: ${{ steps.triage.outputs.os }}
      failed_jobs: ${{ steps.triage.outputs.failed_jobs }}
      run_url: ${{ steps.triage.outputs.run_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/nightly-autofix
      - id: triage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          FORCE: ${{ inputs.force == true }}
        run: |
          python3 .github/nightly-autofix/triage.py --run-id "$RUN_ID" \
            --max-attempts "$MAX_ATTEMPTS" --logs-dir "$RUNNER_TEMP/logs" --force "$FORCE"
      - if: steps.triage.outputs.proceed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autofix-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: error
          retention-days: 3

  fix:
    needs: triage
    if: needs.triage.outputs.proceed == 'true'
    runs-on: ${{ needs.triage.outputs.os == 'macos' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # The nightly's own build configuration, so the agent's builds match it.
      COIL_LLVM_LINK: static
      COIL_SKIP_INSTALL: "1"
      LLVM_CONFIG: ${{ needs.triage.outputs.os == 'macos' && '/opt/homebrew/opt/llvm/bin/llvm-config' || 'llvm-config-21' }}
      NIGHTLY_COMMAND: python3 scripts/dev.py build ${{ needs.triage.outputs.os == 'macos' && 'full' || 'linux' }}
    steps:
      - name: Require a Claude credential
        env:
          HAVE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAVE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAVE_OAUTH" != true ] && [ "$HAVE_KEY" != true ]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) or ANTHROPIC_API_KEY repository secret."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-build-deps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: autofix-logs
          path: ${{ runner.temp }}/autofix/logs
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Prepare the agent's workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "AUTOFIX_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "AUTOFIX_DIR=$RUNNER_TEMP/autofix" >> "$GITHUB_ENV"
      - name: Run Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          HOST_OS: ${{ needs.triage.outputs.os }}
          FAILED_JOBS: ${{ needs.triage.outputs.failed_jobs }}
          FAILED_RUN_URL: ${{ needs.triage.outputs.run_url }}
        run: |
          # An empty variable is not "unset" to every client; drop whichever is absent.
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          prompt="$AUTOFIX_DIR/prompt.md"
          {
            sed "s|\$AUTOFIX_DIR|$AUTOFIX_DIR|g" .github/nightly-autofix/prompt.md
            echo
            echo "## Context"
            echo
            echo "- Failed run: $FAILED_RUN_URL"
            echo "- Failed jobs: $FAILED_JOBS (the nightly has jobs macos, linux, publish)"
            echo "- This host: $HOST_OS"
            echo "- The nightly's build command on this host (environment already set): \`$NIGHTLY_COMMAND\`"
            echo "- Current main: $AUTOFIX_BASE"
            echo "- Autofix attempt $ATTEMPT of $MAX_ATTEMPTS."
            if [ "$ATTEMPT" -gt 1 ]; then
              echo "  A previous attempt already ran; check \`git log\` for its \`Nightly-Autofix:\` commit and do not repeat an approach that failed."
            fi
            echo
            cat "$AUTOFIX_DIR/logs/SUMMARY.md"
          } > "$prompt"
          claude -p "$(cat "$prompt")" \
            --model "$CLAUDE_MODEL" \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose \
            | jq -r --unbuffered '
                if .type == "assistant" then
                  .message.content[] |
                  if .type == "text" then "▌ " + .text
                  elif .type == "tool_use" then "→ " + .name + " " + (.input | tostring | .[0:400])
                  else empty end
                elif .type == "result" then "== " + (.subtype // "") + " turns=" + (.num_turns | tostring) + " cost=$" + (.total_cost_usd // 0 | tostring)
                else empty end'
      - name: Export the agent's commits
        if: always()
        run: |
          AUTOFIX_DIR=${AUTOFIX_DIR:-$RUNNER_TEMP/autofix}
          mkdir -p "$AUTOFIX_DIR/out"
          if [ -f "$AUTOFIX_DIR/result.json" ]; then cp "$AUTOFIX_DIR/result.json" "$AUTOFIX_DIR/out/"; fi
          # Unset when the job failed before the checkout; there is nothing to export.
          if [ -n "${AUTOFIX_BASE:-}" ]; then
            if [ "$(git rev-list --count "$AUTOFIX_BASE..HEAD")" -gt 0 ]; then
              git format-patch --stdout "$AUTOFIX_BASE..HEAD" > "$AUTOFIX_DIR/out/fix.patch"
              git log --stat "$AUTOFIX_BASE..HEAD"
            fi
            git status --short
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autofix-result
          path: ${{ runner.temp }}/autofix/out
          if-no-files-found: ignore
          retention-days: 14

  apply:
    needs: [triage, fix]
    if: always() && (needs.triage.outputs.proceed == 'true' || needs.triage.outputs.notify == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.triage.outputs.proceed == 'true'
        continue-on-error: true
        with:
          name: autofix-result
          path: ${{ runner.temp }}/result
      - name: Apply, push, rerun, report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_DIR: ${{ runner.temp }}/result
          ATTEMPT: ${{ needs.triage.outputs.attempt }}
          FAILED_RUN_URL: ${{ needs.triage.outputs.run_url }}
          TRIAGE_PROCEED: ${{ needs.triage.outputs.proceed }}
          TRIAGE_REASON: ${{ needs.triage.outputs.reason }}
          FIX_RESULT: ${{ needs.fix.result }}
          AUTOFIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Run a copy: `git am` rewrites the checkout this script lives in.
          cp .github/nightly-autofix/apply.sh "$RUNNER_TEMP/apply.sh"
          bash "$RUNNER_TEMP/apply.sh"
