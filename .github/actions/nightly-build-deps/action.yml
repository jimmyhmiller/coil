name: Nightly build dependencies
description: >
  Installs what the nightly's static toolchain build needs on this runner: LLVM
  (Homebrew on macOS, apt.llvm.org 21 on Linux) and the bundled libcurl. Shared by
  the nightly and by nightly-autofix, so the agent reproduces a failure on the same
  toolchain the nightly used.

runs:
  using: composite
  steps:
    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install coreutils llvm
    - name: Install LLVM and static system libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends llvm-21 llvm-21-dev clang-21 libclang-rt-21-dev libzstd-dev libxml2-dev
        echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
    - name: Build bundled libcurl
      shell: bash
      run: scripts/native/build-curl.sh
