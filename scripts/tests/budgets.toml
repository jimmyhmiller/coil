# Time budgets, in seconds, for every test step. Read by scripts/tests/harness.py.
#
# A step over its budget fails; a step with no entry here fails; a tier whose
# serial wall time passes its limit fails. COIL_BUDGET_SCALE multiplies every
# number (CI runners use 1.5). Re-baseline with
#   python3 scripts/dev.py test fast --compiler <coil> --rebaseline 3
# which sets each budget to twice the median of three runs (at least 3 s); review
# the diff. Twice, not less: on a shared machine one run of a step can take twice
# its median, and a budget is there to catch a step that has grown, not noise.

[fast]
total = 270   # target for the serial wall time; a warning above it
hard = 300    # the serial wall time over which FAST fails

