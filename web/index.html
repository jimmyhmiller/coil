<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coil Playground</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;   --panel: #ffffff; --edge: #e3e1dc; --ink: #1b1a17;
    --dim: #6f6c65;  --accent: #b4530a; --ok: #2f6f3e;  --bad: #b3261e;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1d1f23; --edge: #2f3237; --ink: #e6e4df;
      --dim: #918d85; --accent: #e8964a; --ok: #7fc08c; --bad: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  button, select {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 6px;
    border: 1px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-left: auto; color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  section + section { border-left: 1px solid var(--edge); }
  @media (max-width: 800px) { section + section { border-left: 0; border-top: 1px solid var(--edge); } }
  .label {
    padding: 6px 16px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--edge);
  }
  textarea, pre {
    flex: 1; margin: 0; padding: 14px 16px; border: 0; resize: none; overflow: auto;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: transparent; color: var(--ink); tab-size: 2;
  }
  textarea:focus { outline: none; }
  pre { white-space: pre-wrap; word-break: break-word; }
  .err { color: var(--bad); }
  .ok { color: var(--ok); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Coil <span>playground</span></h1>
  <select id="sample" aria-label="Example"></select>
  <button id="run" class="primary" disabled>Run</button>
  <button id="compile" disabled>Compile to wasm</button>
  <button id="download" disabled>Download .wasm</button>
  <span id="status">loading compiler…</span>
</header>
<main>
  <section>
    <div class="label">main.coil</div>
    <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
  </section>
  <section>
    <div class="label">output</div>
    <pre id="output" class="dim">The compiler is a 3.4 MB wasm module. It is fetched, compiled, and run entirely in this tab — nothing is sent to a server.</pre>
  </section>
</main>

<script type="module">
const SAMPLES = {
  'hello': `(module hello)
(import "coil.primitive" :as primitive)
(import "coil.io" :use *)

(defn main [] (-> i64)
  (print-str (stdout) "hello from a compiler that is itself wasm\\n")
  0)`,
  'sum to 100': `(module sum)
(import "coil.primitive" :as primitive)
(import "coil.io" :use *)

(defn main [] (-> i64)
  (let [(mut total) 0
        (mut i) 1]
    (loop (if (> (load i) 100)
              (break)
              (do (set! total (primitive/iadd (load total) (load i)))
                  (set! i (primitive/iadd (load i) 1)))))
    (print-int (stdout) (load total))
    (write-byte (stdout) (primitive/cast u8 10))
    0))`,
  'sum types + match': `(module shapes)
(import "coil.primitive" :as primitive)
(import "coil.io" :use *)

(defsum Shape
  (Square [(side i64)])
  (Rect   [(w i64) (h i64)]))

(defn area [(s Shape)] (-> i64)
  (match s
    (Square [side] (primitive/imul side side))
    (Rect [w h]    (primitive/imul w h))))

(defn main [] (-> i64)
  (print-int (stdout) (area (Rect 6 7)))
  (write-byte (stdout) (primitive/cast u8 10))
  0)`,
  'answer (compiles to wasm)': `(module answer)
(import "coil.primitive" :as primitive)

; The native wasm backend emits a standalone module with no imports.
; Use "Compile to wasm" on this one and the page instantiates the result.
(defn main [] (-> i64)
  (primitive/iadd 40 2))`,
  'a type error': `(module broken)
(import "coil.primitive" :as primitive)

(defn main [] (-> i64)
  (if true 1 "not an integer"))`,
};

const editor = document.getElementById('editor');
const output = document.getElementById('output');
const status = document.getElementById('status');
const sample = document.getElementById('sample');
const runBtn = document.getElementById('run');
const compileBtn = document.getElementById('compile');
const downloadBtn = document.getElementById('download');

for (const name of Object.keys(SAMPLES)) {
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  sample.append(opt);
}
editor.value = SAMPLES['hello'];
sample.onchange = () => { editor.value = SAMPLES[sample.value]; };

const worker = new Worker('./coil-worker.js', { type: 'module' });
let pending = null;
let lastModule = null;
let nextId = 1;

function show(parts) {
  output.replaceChildren();
  output.className = '';
  for (const [cls, text] of parts) {
    if (!text) continue;
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    output.append(span);
  }
  if (!output.childNodes.length) output.append(Object.assign(document.createElement('span'), { className: 'dim', textContent: '(no output)' }));
}

function busy(on) {
  runBtn.disabled = compileBtn.disabled = on;
}

worker.onmessage = (ev) => {
  const msg = ev.data;

  if (msg.type === 'ready') {
    status.textContent = `compiler ready · ${msg.fileCount} stdlib sources · ${Math.round(msg.ms)} ms`;
    busy(false);
    return;
  }

  if (msg.type === 'error') {
    busy(false);
    show([['err', `host error: ${msg.message}\n`], ['dim', msg.stack ?? '']]);
    return;
  }

  if (msg.type === 'result') {
    busy(false);
    const parts = [];
    if (msg.stderr) parts.push([msg.code === 0 ? '' : 'err', msg.stderr]);
    if (msg.stdout) parts.push(['', msg.stdout]);
    if (msg.trapped) parts.push(['err', `\n[compiler trapped] ${msg.trapped}\n`]);

    if (msg.program) {
      lastModule = msg.program.bytes;
      downloadBtn.disabled = false;
      if (msg.program.error) {
        parts.push(['err', `\nemitted module failed to instantiate: ${msg.program.error}\n`]);
      } else {
        parts.push(['ok', `\nemitted ${msg.program.size} bytes of WebAssembly; main() returned ${msg.program.value}\n`]);
      }
    }
    if (msg.code === 0 && !parts.length) parts.push(['ok', 'ok\n']);

    show(parts);
    status.textContent = `${pending} · exit ${msg.code} · ${Math.round(msg.ms)} ms`;
    return;
  }
};

function send(args, outPath, label) {
  busy(true);
  pending = label;
  downloadBtn.disabled = true;
  lastModule = null;
  status.textContent = `${label}…`;
  output.textContent = 'working…';
  output.className = 'dim';
  worker.postMessage({ type: 'run', id: nextId++, source: editor.value, args, outPath });
}

// `interp` runs the program in the compiler's own bytecode VM: no codegen involved,
// so it handles the whole language. `build --backend wasm` emits a real module but
// the native wasm backend is still missing floats, trait objects, and C strings.
runBtn.onclick = () => send(['interp', '/work/main.coil'], null, 'interp');
compileBtn.onclick = () => send(
  ['build', '/work/main.coil', '--backend', 'wasm', '-o', '/work/out.wasm'], '/work/out.wasm', 'build');

downloadBtn.onclick = () => {
  if (!lastModule) return;
  const url = URL.createObjectURL(new Blob([lastModule], { type: 'application/wasm' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'out.wasm' });
  a.click();
  URL.revokeObjectURL(url);
};

if (typeof WebAssembly.Memory === 'function') {
  try { new WebAssembly.Memory({ initial: 1, maximum: 1, index: 'i64' }); }
  catch {
    status.textContent = 'this browser has no wasm memory64 support';
    show([['err', 'The compiler is built for wasm64 (memory64), which needs Chrome 133+ or Firefox 134+. Safari does not support it yet.\n']]);
    throw new Error('memory64 unsupported');
  }
}

worker.postMessage({ type: 'init', wasmUrl: './coilc.wasm', fsUrl: './coil-fs.bin' });
</script>
</body>
</html>
